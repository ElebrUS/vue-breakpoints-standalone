name: Bug report
description: Report unexpected behavior in vue-breakpoints-standalone.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please provide a minimal reproduction.
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: vue-version
    attributes:
      label: Vue version
      placeholder: 3.5.x
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Browser, SSR, Test runner, Other]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Link to a repository, StackBlitz, or a concise code sample.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
