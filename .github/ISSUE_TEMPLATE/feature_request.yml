name: Feature request
description: Suggest an improvement that fits this package's intentionally small scope.
title: 'feat: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: This package intentionally tracks only VueUse useBreakpoints and its minimal dependencies.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need, not only the proposed API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked that the behavior is not already available in VueUse or this package.
          required: true
